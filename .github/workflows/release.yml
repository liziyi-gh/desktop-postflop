name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            files: |
              desktop-postflop/src-tauri/target/x86_64-pc-windows-msvc/release/desktop-postflop.exe
              desktop-postflop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            files: |
              desktop-postflop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              desktop-postflop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          - platform: macos-latest
            target: aarch64-apple-darwin
            files: desktop-postflop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop-postflop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: desktop-postflop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag and package versions
        run: node scripts/check-release-version.cjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install app dependencies
        run: npm ci

      - name: Update solver to latest main
        run: cargo update --manifest-path src-tauri/Cargo.toml -p postflop-solver

      - name: Build the app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
